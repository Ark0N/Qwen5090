# Reproduces the harness's `minimal` agent preset for the headless
# profile. The preset itself is a Web-surface concept - the headless
# profile mounts no preset roster - so it is rebuilt here: the system
# prompt fixed to one sentence, and every model-facing tool dropped
# except persistent bash and str_replace_editor.
# Scoped to this profile on purpose: the Web UI keeps its full set.
- id: system-prompt
  config:
    persona: You are a helpful software engineer assistant.
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-web
  disabled: true
